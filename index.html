<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/output.css"/>
</head>
<body class="bg-stone-100 text-stone-800 dark:bg-stone-900 dark:text-stone-200 overflow-hidden">
<div id="app" class="flex h-dvh">
    <aside id="sidebar"
           class="bg-stone-200 dark:bg-stone-800 flex-shrink-0 flex flex-col p-4 select-none relative transition-all duration-300 group">
        <div class="flex justify-between group-[.shrunk]:justify-center items-center mb-4">
            <h2 id="sidebar-title"
                class="text-lg font-bold group-[.shrunk]:hidden whitespace-nowrap overflow-hidden text-ellipsis">My
                Pages</h2>
            <button id="toggle-sidebar-btn" class="p-1 rounded-md hover:bg-stone-300 dark:hover:bg-stone-700"
                    title="Toggle Sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                     stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                </svg>
            </button>
        </div>
        <div id="page-list" class="flex flex-col gap-2 flex-grow overflow-y-auto pr-2 group-[.shrunk]:pr-0">
        </div>
        <div class="flex flex-col gap-2 pt-2 border-t border-stone-300 dark:border-stone-700">
            <button id="new-group-btn"
                    class="w-full bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded transition-colors duration-200 flex items-center justify-center gap-2 group-[.shrunk]:w-auto group-[.shrunk]:rounded-full whitespace-nowrap overflow-hidden text-ellipsis">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
                </svg>
                <span class="group-[.shrunk]:hidden">New Group</span>
            </button>
            <button id="new-page-btn"
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition-colors duration-200 flex items-center justify-center gap-2 group-[.shrunk]:w-auto group-[.shrunk]:rounded-full whitespace-nowrap overflow-hidden text-ellipsis">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                <span class="group-[.shrunk]:hidden">New Page</span>
            </button>
    </aside>

    <div id="resizer"
         class="w-1.5 cursor-col-resize flex-shrink-0 bg-stone-300 dark:bg-stone-700 hover:bg-blue-500 transition-colors duration-200"></div>

    <main class="flex-grow p-4 sm:p-6 md:p-8 flex justify-center overflow-y-auto">
        <div class="w-full max-w-4xl">
            <input type="text" id="page-title" placeholder="Give your page a title..."
                   class="text-3xl sm:text-4xl font-bold bg-transparent w-full border-none focus:ring-0 mb-6 px-0 placeholder-stone-400 dark:placeholder-stone-600">
            <div id="editor"
                 contenteditable="true"
                 class="prose-custom w-full focus:outline-none text-lg leading-relaxed"
                 data-placeholder="Start writing your story here...">
            </div>
        </div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
